{% set name = "lbcondawrappers" %}
{% set version = "0.5.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f6c69a1e2ba7d1c373992d1792742bb12994ba5cf38476a261e303fce0f58eee

build:
  entry_points:
    - lb-conda = LbCondaWrappers:lb_conda
    - lb-conda-dev = LbCondaWrappers:lb_conda_dev
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.2
    - setuptools-scm
    - pip
  run:
    - python >={{ python_min }}
    - lb-telemetry >=0.5.0

test:
  imports:
  #  - LbCondaWrappers
  commands:
    - pip check
    # - lb-conda --help
    # - lb-conda-dev --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://gitlab.cern.ch/lhcb-core/LbCondaWrappers
  summary: Wrappers for using LHCb CVMFS conda installations
  dev_url: https://gitlab.cern.ch/lhcb-core/LbCondaWrappers
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bcouturi
    - chrisburr
